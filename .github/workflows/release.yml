name: Release & Build Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: flash-md.exe
            archive_name: flash-md-windows-x86_64.zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: flash-md.exe
            archive_name: flash-md-windows-aarch64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        shell: pwsh
        run: |
          $proc = Start-Process cargo -ArgumentList "build", "--release", "--target", "${{ matrix.target }}" -NoNewWindow -PassThru -RedirectStandardOutput "build_stdout.log" -RedirectStandardError "build_stderr.log"
          $proc.WaitForExit()
          Get-Content "build_stderr.log" -Tail 60
          Get-Content "build_stdout.log" -Tail 40
          if ($proc.ExitCode -ne 0) {
            exit $proc.ExitCode
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log-${{ matrix.target }}
          path: |
            build_stderr.log
            build_stdout.log

      - name: Package Binary (Windows)
        shell: pwsh
        run: |
          $bin_path = "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          Compress-Archive -Path $bin_path, "README.md", "README.zh-TW.md" -DestinationPath "${{ matrix.archive_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
