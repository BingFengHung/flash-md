name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
  # 每天 UTC 00:00 自動排程掃描（台灣時間 08:00）
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── cargo-deny：授權條款、漏洞、yanked 版本、來源管控 ──────────────────────
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ── cargo-audit：RustSec 漏洞資料庫比對 ────────────────────────────────────
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit
