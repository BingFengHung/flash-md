name: CI & Build Check

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Quick Check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Fast Cargo Check
        shell: bash
        run: |
          cargo check --target ${{ matrix.target }} > "check-${{ matrix.target }}.log" 2>&1

      - name: Upload Check Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-${{ matrix.target }}
          path: check-${{ matrix.target }}.log

      - name: Verify Check Exit Code
        shell: bash
        run: |
          cat "check-${{ matrix.target }}.log"
          if grep -q "error:" "check-${{ matrix.target }}.log" || grep -q "error\[" "check-${{ matrix.target }}.log"; then
            exit 1
          fi
