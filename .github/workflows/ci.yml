name: CI & Build Check

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Quick Check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Fast Cargo Check
        shell: pwsh
        run: |
          $out = & cargo check --target ${{ matrix.target }} 2>&1
          $code = $LASTEXITCODE
          $out | Out-File -FilePath "check-err.txt" -Encoding utf8
          if ($code -ne 0) {
            exit $code
          }

      - name: Push Diagnostic Log on Failure
        if: failure()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "ci-debug"
          git add -f "check-err.txt"
          git commit -m "CI failure diagnostic log"
          git push origin "ci-debug" --force
