name: CI & Build Check

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build & Verify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: flash-md.exe
            archive_name: flash-md-test-windows-x86_64.zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: flash-md.exe
            archive_name: flash-md-test-windows-aarch64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Cargo Check
        shell: pwsh
        run: |
          $output = & cargo check --target ${{ matrix.target }} 2>&1
          $exit_code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exit_code -ne 0) {
            "### ❌ Cargo Check Failed on ${{ matrix.target }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            ($output | Out-String) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit $exit_code
          }

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Windows)
        shell: pwsh
        run: |
          $bin_path = "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          Compress-Archive -Path $bin_path, "README.md", "README.zh-TW.md" -DestinationPath "${{ matrix.archive_name }}"

      - name: Upload Test Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
